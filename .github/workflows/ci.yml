name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The jobs are those that oxirush-ngap and oxirush-s1ap share, in the repository of
  # oxirush-aper, at the revision that build/revisions records: the tests, the oracle,
  # the package alone, the crate in a larger workspace, the benchmarks, the fuzz
  # targets, the format, and the files that the tools write.
  ci:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol.yml@6252c750dde9ba669bcc3501dbf08ffec0638758
    with:
      protocol: ngap

  # The blocks of the README that use other crates of the family: `family/` is a
  # package of its own, which takes them at the revisions of its manifest, so that the
  # crate depends on none of them. It compares what each block prints with the README.
  family:
    name: The README blocks with the other crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: family
      - run: cargo test --manifest-path family/Cargo.toml
      - run: cargo clippy --manifest-path family/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path family/Cargo.toml
