name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer run of a branch, or of a pull request, cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The jobs are those that oxirush-ngap and oxirush-s1ap share, in the repository of
  # oxirush-aper, at the revision that build/revisions records: the tests,
  # the package alone, the crate in a larger workspace, the benchmarks, the fuzz
  # targets, the format, and the files that the tools write.
  ci:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol.yml@0261e08543b789e2c546de7b5cc62de7998fb1cf
    with:
      protocol: ngap
