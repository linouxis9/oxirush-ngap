name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tests need no debug information, and with it the compiler needs more
  # memory for this crate than a hosted runner gives a job.
  CARGO_PROFILE_DEV_DEBUG: 0
  # oxirush-aper 0.1.0 is not on crates.io yet: take it from its repository.
  APER: --config patch.crates-io.oxirush-aper.git="https://github.com/linouxis9/oxirush-aper"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With the oracle of the tests: the same types with the codec of rasn, which
      # each vector, and what a peer may send in its place, is compared with.
      - run: cargo test $APER --all-features
      - run: cargo test $APER

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test $APER --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy $APER --all-targets --all-features -- -D warnings
      - run: cargo clippy $APER --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc $APER --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # The package takes oxirush-aper from its repository by a patch of its own
      # manifest, so its commands need no `--config`.
      # The inputs of the benchmarks are messages that the codec gives back.
      - run: cargo test --manifest-path benches/Cargo.toml
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --manifest-path benches/Cargo.toml --no-run

  # Each target gives its octets to the crate and to the oracle of the tests, the
  # codec of rasn, and compares what the two read and write.
  fuzz:
    name: Fuzz the codec and the JSON forms against the oracle (3 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Each corpus starts from the vectors of tests/fixtures.
      - run: ./fuzz/seed.sh
      - run: cargo fuzz run decode -- -max_total_time=60 -max_len=4096
      - run: cargo fuzz run view -- -max_total_time=60 -max_len=4096
      - run: cargo fuzz run paths -- -max_total_time=60 -max_len=4096

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
