name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer run of a branch, or of a pull request, cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The jobs are those that oxirush-ngap and oxirush-s1ap share, in the repository of
  # oxirush-aper, at the revision that build/revisions records: the tests, the oracle,
  # the package alone, the crate in a larger workspace, the benchmarks, the fuzz
  # targets, the format, and the files that the tools write.
  ci:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol.yml@ad6b84e868da5267f0c41545ea8a1207b1f00272
    with:
      protocol: ngap
