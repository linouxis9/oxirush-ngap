name: Fuzz

# The fuzz targets of the crate, longer than the minute that each has at a push: the
# jobs that oxirush-ngap and oxirush-s1ap share, in the repository of oxirush-aper, at
# the revision that build/revisions records, which fuzz the crate at this commit with
# the checkout of oxirush-aper at that revision beside it. An hour for each target every
# day but Wednesday and Sunday, from 14:33 UTC, one target at a time, and four hours on
# Wednesday, two at a time, within the six hours that GitHub gives a job; the crates of
# the family fuzz each at an hour of its own, with few jobs at once, and each has a day
# of its own for its long run, so that what they run at once leaves runners to the other
# CI, and Sunday is that of their mutants (GitHub starts a scheduled run hours after its
# time, in their order); the minutes of `minutes` when the workflow is started by hand.
# The corpus of each target is kept from one run to the next in the cache of the
# repository, and grows, and on Wednesday, and when `weekly` is set by hand, it is
# minimized and its coverage of the crates is kept for 30 days. A crash or a timeout
# fails the job, which keeps the input and the log: the input goes into
# tests/fixtures/fuzzed.tsv with its fix. The Fuzz workflow of oxirush-aper runs the
# same targets with this crate at the head of its default branch and oxirush-aper at its
# own.
on:
  schedule:
    - cron: "33 14 * * 1,2,4-6"
    - cron: "33 14 * * 3"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Sunday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of this workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

jobs:
  # A dispatch gives its minutes as text, which fromJSON makes the number that the
  # called workflow takes, as it does the boolean of `weekly`; a schedule gives neither.
  fuzz:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol-fuzz.yml@0bc767bd58c9cb23557707d623815cd9e5611d91
    with:
      protocol: ngap
      weekly: "33 14 * * 3"
      parallel: ${{ (github.event.schedule == '33 14 * * 3' || fromJSON(inputs.weekly || 'false')) && 2 || 1 }}
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
