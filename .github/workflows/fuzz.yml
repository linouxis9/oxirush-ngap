name: Fuzz

# The fuzz targets of the crate, longer than the minute that each has at a push: the jobs
# that oxirush-ngap and oxirush-s1ap share, in the repository of oxirush-aper, at the
# revision that build/revisions records, which fuzz the crate at this commit with the
# checkout of oxirush-aper at that revision beside it. An hour for each target every night
# and four hours on Sunday evening, once the Sunday runs of the other crates of the family
# are over, within the six hours that GitHub gives a job; the minutes of `minutes` when
# the workflow is started by hand. The corpus of each target is kept from one run to the
# next in the cache of the repository, and grows, and on Sunday, and when `weekly` is set
# by hand, it is minimized and its coverage of the crates is kept for 30 days. A crash or
# a timeout fails the job, which keeps the input and the log: the input goes into
# tests/fixtures/fuzzed.tsv with its fix. The Fuzz workflow of oxirush-aper runs the same
# targets with this crate at the head of its default branch and oxirush-aper at its own.
on:
  schedule:
    - cron: "13 8 * * 1-6"
    - cron: "43 22 * * 0"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Sunday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of this workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

jobs:
  # A dispatch gives its minutes as text, which fromJSON makes the number that the
  # called workflow takes, as it does the boolean of `weekly`; a schedule gives neither.
  fuzz:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol-fuzz.yml@ea1df59c7a30322b80ed0554ac6e26a51373e32e
    with:
      protocol: ngap
      weekly: "43 22 * * 0"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
