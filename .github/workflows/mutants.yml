name: Mutants

# The mutation testing of the crate: the jobs that oxirush-ngap and oxirush-s1ap share,
# in the repository of oxirush-aper, at the revision that build/revisions records, which
# say what each run mutates. The workflow is run by hand before a release: with `full`,
# every mutant; without it, the mutants of the code that the commits since the last run
# changed, and none without such a commit; with `recheck`, the mutants that a file of
# the repository names, as a missed.txt has them, again at the head. Few jobs run at
# once, to leave runners to the other CI.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the changes since the last run
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than one
        type: string
        default: ""
      recheck:
        description: A file of the repository that names mutants, one a line, to run again at the head
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of this workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

jobs:
  mutants:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol-mutants.yml@b9d069655622163c6ca84e4ba8cc1181b01f4bfb
    with:
      protocol: ngap
      full: ${{ fromJSON(inputs.full || 'false') }}
      parallel: ${{ inputs.parallel || '' }}
      recheck: ${{ inputs.recheck || '' }}
