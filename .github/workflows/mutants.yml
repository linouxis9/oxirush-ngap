name: Mutants

# The mutation testing of the crate: the jobs that oxirush-ngap and oxirush-s1ap share,
# in the repository of oxirush-aper, at the revision that build/revisions records, which
# say what each run mutates. Every mutant runs each Sunday, the day of the week without
# fuzzing, and when the run is started by hand with `full`; on the other nights after a
# day with a commit, and when it is started by hand without `full`, the mutants of the
# code that the commits of the last day changed; started by hand with `recheck`, the
# mutants that a file of the repository names, as a missed.txt has them, again at the
# head. The crates of the family start at times of their own, with few jobs at once, to
# leave runners to the other CI.
on:
  schedule:
    - cron: "53 22 * * 0"
    - cron: "43 3 * * 1-6"
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the last day's changes
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than one
        type: string
        default: ""
      recheck:
        description: A file of the repository that names mutants, one a line, to run again at the head
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of this workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

jobs:
  mutants:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol-mutants.yml@8a8b5d7e66746b09617827f58359a537ba838508
    with:
      protocol: ngap
      weekly: "53 22 * * 0"
      full: ${{ fromJSON(inputs.full || 'false') }}
      parallel: ${{ inputs.parallel || '' }}
      recheck: ${{ inputs.recheck || '' }}
