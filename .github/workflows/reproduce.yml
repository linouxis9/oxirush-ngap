name: Reproduce

# The bindings, and those for rasn of the benchmarks, from the ASN.1 of the specification, and
# the vectors from pycrate: what the README says anyone can check. It fetches the
# archive of the specification from 3GPP and pycrate from PyPI, so it runs when what it
# checks changes, and on demand.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - build/**
      - src/ngap.rs
      - src/registry.rs
      - src/inspect_registry.rs
      - rasn/**
      - tests/fixtures/**
      - tests/vectors.rs
      - .github/workflows/reproduce.yml
  pull_request:
    paths:
      - build/**
      - src/ngap.rs
      - src/registry.rs
      - src/inspect_registry.rs
      - rasn/**
      - tests/fixtures/**
      - tests/vectors.rs
      - .github/workflows/reproduce.yml

permissions:
  contents: read

jobs:
  # The job is the one that oxirush-ngap and oxirush-s1ap share, in the repository of
  # oxirush-aper, at the revision that build/revisions records.
  reproduce:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol-reproduce.yml@90d5100c504afc55d0e5d412aae84cb69e46fc35
    with:
      protocol: ngap
      archive: 38_series/38.413/38413-j40.zip
