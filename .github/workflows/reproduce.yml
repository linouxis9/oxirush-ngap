name: Reproduce

# The bindings and the oracle of the tests from the ASN.1 of the specification, and
# the vectors from pycrate: what the README says anyone can check. It fetches the
# archive of the specification from 3GPP and pycrate from PyPI, so it runs when what it
# checks changes, and on demand.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - build/**
      - src/ngap.rs
      - src/registry.rs
      - src/inspect_registry.rs
      - oracle/**
      - tests/fixtures/**
      - tests/vectors.rs
      - .github/workflows/reproduce.yml
  pull_request:
    paths:
      - build/**
      - src/ngap.rs
      - src/registry.rs
      - src/inspect_registry.rs
      - oracle/**
      - tests/fixtures/**
      - tests/vectors.rs
      - .github/workflows/reproduce.yml

permissions:
  contents: read

jobs:
  # The job is the one that oxirush-ngap and oxirush-s1ap share, in the repository of
  # oxirush-aper, at the revision that build/revisions records.
  reproduce:
    uses: linouxis9/oxirush-aper/.github/workflows/protocol-reproduce.yml@f5b5dd0ab85dda315cf0f44c0f919432b3257251
    with:
      protocol: ngap
      archive: 38_series/38.413/38413-j40.zip
