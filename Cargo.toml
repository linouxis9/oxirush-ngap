[package]
name = "oxirush-ngap"
version = "0.5.0"
edition = "2024"
description = "5G NGAP (NG Application Protocol) APER codec — auto-generated from 3GPP ASN.1 definitions"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-ngap"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "ngap", "3gpp", "asn1", "aper"]
categories = ["network-programming", "encoding", "parser-implementations"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.tsv",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[features]
inspect = ["dep:serde_json", "oxirush-aper/inspect"]

[package.metadata.docs.rs]
all-features = true

# cargo-fuzz sets `fuzzing`: with it the crate has what the targets of `fuzz/` take
# from its inside.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
oxirush-aper = "0.1.0"
serde_json = { version = "1.0.106", optional = true }

[dev-dependencies]
hex = "0.4"
# The oracle of the tests: the same types with the codec of rasn. The tests that the
# two protocols share name it `oracle`.
oracle = { package = "oxirush-ngap-oracle", path = "oracle", features = ["rasn"] }

[[example]]
name = "ngap_build_pdu"
doc-scrape-examples = false

[[example]]
name = "ngap_decode_manually"
doc-scrape-examples = false

[[example]]
name = "ngap_extract_ies"
doc-scrape-examples = false

[[example]]
name = "ngap_inspect"
required-features = ["inspect"]
doc-scrape-examples = false
