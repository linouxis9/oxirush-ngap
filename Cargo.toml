[package]
name = "oxirush-ngap"
version = "0.5.0"
edition = "2024"
description = "5G NGAP (3GPP TS 38.413, Release 19) in Rust, generated from the ASN.1: aligned PER, IEs read and built by name, message checks with their causes, JSON trees and serde. No unsafe code."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-ngap"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "ngap", "3gpp", "asn1", "telecom"]
categories = ["network-programming", "encoding", "parser-implementations"]
readme = "README.md"
# `benches/` is a package of its own, whose files are no benchmark of the crate.
autobenches = false
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.tsv",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
]

[features]
inspect = ["oxirush-aper/inspect", "oxirush-utils/tree"]
# `Serialize` and `Deserialize` for every type of the bindings, through its tree.
serde = ["inspect", "oxirush-utils/serde", "dep:serde_core"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `--cfg oxirush_ngap_hooks` gives the fuzz targets of `fuzz/` what they take from the
# inside of the crate, the module `hooks`. No other build has it: cargo-fuzz sets
# `fuzzing` for every crate of a fuzz build, and that changes nothing here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(oxirush_ngap_hooks)'] }

[dependencies]
# One version exactly: the crate builds on the module `inspect` of oxirush-aper, which is
# hidden and changes with the two protocol crates, which are released with it in step.
oxirush-aper = "=0.1.0"
oxirush-utils = "0.1.0"
serde_core = { version = "1.0.220", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4"
# JSON as text, and YAML, another format that describes itself, for the tests of `serde`.
serde_json = "1.0.154"
serde_norway = "0.9"

[[example]]
name = "ngap_build_pdu"
doc-scrape-examples = false

[[example]]
name = "ngap_decode_manually"
doc-scrape-examples = false

[[example]]
name = "ngap_extract_ies"
doc-scrape-examples = false

[[example]]
name = "ngap_inspect"
required-features = ["inspect"]
doc-scrape-examples = false
