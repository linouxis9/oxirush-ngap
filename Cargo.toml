[package]
name = "oxirush-ngap"
version = "0.5.0"
edition = "2024"
description = "5G NGAP (NG Application Protocol) APER codec — auto-generated from 3GPP ASN.1 definitions"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-ngap"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "ngap", "3gpp", "asn1", "aper"]
categories = ["network-programming", "encoding", "parser-implementations"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.tsv",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[features]
inspect = ["dep:serde_json"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
rasn = { version = "0.28.15", default-features = false, features = ["bytes"] }
serde_json = { version = "1.0.106", optional = true }

[dev-dependencies]
hex = "0.4"

[[example]]
name = "build_pdu"
doc-scrape-examples = false

[[example]]
name = "decode_manually"
doc-scrape-examples = false

[[example]]
name = "extract_ies"
doc-scrape-examples = false

[[example]]
name = "inspect"
required-features = ["inspect"]
doc-scrape-examples = false
