# The benchmarks and the profilers of oxirush-ngap. A package of its own, so
# that the crate keeps its two dependencies: nothing here is published.
[package]
name = "oxirush-ngap-benches"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# The inputs and the operations, which the three programs share. The name is
# the same in oxirush-ngap and oxirush-s1ap, whose programs are the same files.
[lib]
name = "benches"

[dependencies]
oxirush-ngap = { path = "..", features = ["inspect"] }
hex = "0.4"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
pprof = { version = "0.15", features = ["criterion", "protobuf-codec", "flamegraph"] }
dhat = "0.3"

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "allocations"
harness = false

[[bench]]
name = "heap"
harness = false

[[bench]]
name = "scale"
harness = false

# Symbols for the profiles.
[profile.bench]
debug = true

# Not a member of a workspace that the crate may be in.
[workspace]

# oxirush-aper 0.1.0 and oxirush-utils 0.1.0 are not on crates.io yet: until they are
# published, they come from their repositories, at the revisions of build/revisions.
[patch.crates-io]
oxirush-aper = { git = "https://github.com/linouxis9/oxirush-aper", rev = "110c82dd1f0774c9aade5b0c65ba3e1c4c963888" }
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "6d2ff3142ed8ffa4089774fc843db4a528cae4fc" }
