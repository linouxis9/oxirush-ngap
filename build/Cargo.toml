[package]
name = "oxirush-ngap-generator"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "oxirush-ngap-generator"
path = "main.rs"

[dependencies]
# What the generators of the two protocols share, in the repository of oxirush-aper,
# which is checked out beside this one.
generator = { package = "oxirush-aper-generator", path = "../../oxirush-aper/generator" }
rasn-compiler = "=0.16.0"
anyhow = "1"
regex = "1"
