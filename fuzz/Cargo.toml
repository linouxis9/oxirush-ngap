# The fuzz targets of oxirush-ngap, for cargo-fuzz. A package of its own, which
# is not published. Its targets are those of `protocols/fuzz/` of oxirush-aper, in
# the checkout beside this repository, which oxirush-ngap and oxirush-s1ap share:
# they name the crate `codec`, and take what is of the protocol from its module
# `hooks`.
[package]
name = "oxirush-ngap-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# What the targets do, which the programs call.
[lib]
name = "targets"
path = "../../oxirush-aper/protocols/fuzz/src/lib.rs"

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"

[dependencies.codec]
package = "oxirush-ngap"
path = ".."
features = ["inspect"]

# Not part of any parent workspace.
[workspace]
members = ["."]

# oxirush-aper is the checkout beside this repository, whose targets these are.
[patch.crates-io]
oxirush-aper = { path = "../../oxirush-aper" }

[[bin]]
name = "decode"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exact"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/exact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transfer"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/transfer.rs"
test = false
doc = false
bench = false
