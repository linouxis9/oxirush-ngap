# The fuzz targets of oxirush-ngap, for cargo-fuzz. A package of its own, which
# is not published.
[package]
name = "oxirush-ngap-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# What the targets do, which the three programs call. The name is the same in
# oxirush-ngap and oxirush-s1ap, whose targets are the same files.
[lib]
name = "targets"

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.oxirush-ngap]
path = ".."
features = ["inspect"]

# The oracle that the targets compare the crate with: the same types with the codec
# of rasn.
[dependencies.oracle]
package = "oxirush-ngap-oracle"
path = "../oracle"

# Not part of any parent workspace.
[workspace]
members = ["."]

# oxirush-aper 0.1.0 is not on crates.io yet: until it is published, it comes
# from its repository.
[patch.crates-io]
oxirush-aper = { git = "https://github.com/linouxis9/oxirush-aper" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view"
path = "fuzz_targets/view.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false
