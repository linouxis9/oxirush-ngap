# The fuzz targets of oxirush-ngap, for cargo-fuzz. A package of its own, which
# is not published. Its targets are those of `protocols/fuzz/` of oxirush-aper, in
# the checkout beside this repository, which oxirush-ngap and oxirush-s1ap share:
# they name the crate `codec`, and take what is of the protocol from its module
# `hooks`.
[package]
name = "oxirush-ngap-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# What the targets do, which the three programs call.
[lib]
name = "targets"
path = "../../oxirush-aper/protocols/fuzz/src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.codec]
package = "oxirush-ngap"
path = ".."
features = ["inspect"]

# The oracle that the targets compare the crate with: the same types with the codec
# of rasn.
[dependencies.oracle]
package = "oxirush-ngap-oracle"
path = "../oracle"

# Not part of any parent workspace.
[workspace]
members = ["."]

# oxirush-aper 0.1.0 and oxirush-utils 0.1.0 are not on crates.io yet: until they are
# published, oxirush-aper is the checkout beside this repository, whose targets these
# are, and oxirush-utils comes from its repository, at the revision of build/revisions.
[patch.crates-io]
oxirush-aper = { path = "../../oxirush-aper" }
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "eb1c453cd08dc3d0b712f53d4273595793cb9106" }

[[bin]]
name = "decode"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/view.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "../../oxirush-aper/protocols/fuzz/fuzz_targets/paths.rs"
test = false
doc = false
bench = false
