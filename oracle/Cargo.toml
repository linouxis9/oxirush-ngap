# The oracle of the tests of oxirush-ngap: the same types with the codec of rasn,
# another implementation of aligned PER. A package of its own, which the tests and
# the fuzz targets of the crate depend on, and no build of the crate: nothing here is
# published.
[package]
name = "oxirush-ngap-oracle"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Support of the tests of the crate: it has no test of its own, which are in the
# tests of the crate, and nothing documents it. It has no workspace of its own either:
# the crate depends on it by path, so it is a member of each workspace that the crate
# is a member of.
[lib]
test = false
doctest = false
doc = false

[features]
# The types and their codec, which the tests of the crate and its fuzz targets ask
# for. Without it the package is empty: a workspace that has the crate as a member
# builds nothing of rasn until it builds the tests of the crate, as the feature
# resolver 2 or 3 gives a package no feature that only the tests of another ask for.
rasn = ["dep:rasn", "dep:serde_json"]

[dependencies]
rasn = { version = "0.29.0", default-features = false, features = ["bytes"], optional = true }
serde_json = { version = "1.0.106", optional = true }
