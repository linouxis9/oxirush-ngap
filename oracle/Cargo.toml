# The oracle of the tests of oxirush-ngap: the same types with the codec of rasn,
# another implementation of aligned PER. A package of its own, which the tests and
# the fuzz targets of the crate depend on, and no build of the crate: nothing here is
# published.
[package]
name = "oxirush-ngap-oracle"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# The name is the same in oxirush-ngap and oxirush-s1ap, whose tests are the same files.
[lib]
name = "oracle"

[dependencies]
rasn = { version = "0.29.0", default-features = false, features = ["bytes"] }
serde_json = "1.0.106"

# Not a member of a workspace that the crate may be in.
[workspace]
