# The oracle of oxirush-ngap: the same types with the codec of rasn, another
# implementation of aligned PER, and the tests that compare the crate with it. A
# package of its own, which depends on the crate: the crate does not depend on it, so
# no build and no test of the crate builds rasn. Nothing here is published.
[package]
name = "oxirush-ngap-oracle"
version = "0.0.0"
edition = "2024"
# The Rust that the crate is built with at least: cargo then takes the versions of the
# dependencies of rasn that this Rust builds.
rust-version = "1.88"
publish = false
license = "Apache-2.0"

# The library is the oracle, which the tests of `tests/` and the fuzz targets of the
# crate name `oracle`. It has no unit test, and nothing documents it.
[lib]
name = "oracle"
test = false
doctest = false
doc = false

[dependencies]
rasn = { version = "0.29.0", default-features = false, features = ["bytes"] }
serde_json = "1.0.106"

# The crate that the tests compare with the oracle. The tests that the two protocols
# share name it `codec`.
[dev-dependencies]
codec = { package = "oxirush-ngap", path = "..", features = ["inspect"] }
hex = "0.4"

# The tests take what they need from the inside of the crate through its module
# `hooks`, which it has with `--cfg oxirush_ngap_hooks`: `.cargo/config.toml` sets it
# for a cargo that is run from this directory. `tests/compare.rs`, which the two
# protocols share, names the one of each.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(oxirush_ngap_hooks)', 'cfg(oxirush_s1ap_hooks)'] }

# Not a member of a workspace that the crate may be in.
[workspace]

# oxirush-aper 0.1.0 and oxirush-utils 0.1.0 are not on crates.io yet: until they are
# published, they come from their repositories, at the revisions of build/revisions.
[patch.crates-io]
oxirush-aper = { git = "https://github.com/linouxis9/oxirush-aper", rev = "517165ba860eee4a19b780461be9141b8a342df9" }
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "b4f61a4c0177216d2f597d28e44ff0f679c58d8a" }
