# The bindings for rasn of oxirush-ngap: the same types with the codec of rasn 0.29, another
# implementation of aligned PER, which the benchmarks of `benches/` time beside the
# crate. A package of its own: the crate does not depend on it, so no build and no test
# of the crate builds rasn. Nothing here is published. Its codecs in the place of
# rasn's are those of `protocols/rasn/` of oxirush-aper, in the checkout beside this
# repository; what is of the protocol is the bindings of `src/`, which the generator
# writes.
[package]
name = "oxirush-ngap-rasn"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[lib]
name = "rasn_bindings"
path = "../../oxirush-aper/protocols/rasn/src/lib.rs"
test = false
doctest = false
doc = false

[dependencies]
rasn = { version = "0.29.0", default-features = false, features = ["bytes"] }

# Not a member of a workspace that the crate may be in.
[workspace]
